# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: LOANAPPLICATIONAPI
- name: imagetag
  value: '$(Build.BuildId)'

steps:
- task: DockerCompose@1
  displayName: "Build Docker Compose"
  inputs:
    containerregistrytype: 'Azure Container Registry'
    azureSubscription: 'Azure subscription 1(6940fc78-e8c0-4d97-96cd-b6b824327fcc)'
    azureContainerRegistry: '{"loginServer":"creditflowacrdvid.azurecr.io", "id" : "/subscriptions/6940fc78-e8c0-4d97-96cd-b6b824327fcc/resourceGroups/CursoDavidCreditFlow/providers/Microsoft.ContainerRegistry/registries/creditflowacrdvid"}'
    dockerComposeFile: '**/docker-compose.yml'
    projectName: 'loanapplicationapi'
    action: 'Build services'
    qualifyImageNames: true

    dockerComposeFileArgs: |
      DOCKER_REGISTRY=creditflowacrdvid.azurecr.io/
    additionalImageTags: |
      $(imagetag)

    includeLatestTag: true
- task: DockerCompose@1
  displayName: "Push Docker Compose to ACR"
  inputs:
    containerregistrytype: 'Azure Container Registry'
    azureSubscription: 'Azure subscription 1(6940fc78-e8c0-4d97-96cd-b6b824327fcc)'
    azureContainerRegistry: '{"loginServer":"creditflowacrdvid.azurecr.io", "id" : "/subscriptions/6940fc78-e8c0-4d97-96cd-b6b824327fcc/resourceGroups/CursoDavidCreditFlow/providers/Microsoft.ContainerRegistry/registries/creditflowacrdvid"}'
    dockerComposeFile: '**/docker-compose.yml'
    projectName: 'loanapplicationapi'
    action: 'Push services'

    qualifyImageNames: true

    dockerComposeFileArgs: |
      DOCKER_REGISTRY=creditflowacrdvid.azurecr.io/
    additionalImageTags: |
      $(imagetag)

    includeLatestTag: true

- task: KubernetesManifest@1
  inputs:
    action: 'createSecret'
    connectionType: 'kubernetesServiceConnection'
    kubernetesServiceConnection: 'aks-creditflow-connection'
    namespace: 'prod'
    secretType: 'generic'
    secretName: 'loanapplicationapi-secrets'

    secretArguments: >
      --from-literal=LoanApplicationConnection="$(LoanApplicationConnection)"
      --from-literal=ServiceBusConnection="$(ServiceBusConnection)"

- task: KubernetesManifest@1
  inputs:
    action: 'deploy'
    connectionType: 'kubernetesServiceConnection'
    kubernetesServiceConnection: 'aks-creditflow-connection'
    namespace: 'prod'
    manifests: |
      $(Build.SourcesDirectory)/k8s/deployment.yml
      $(Build.SourcesDirectory)/k8s/service.yml
    containers: 'creditflowacrdvid.azurecr.io/loanapplicationapi:$(imagetag)'
    rolloutStatusTimeout: '300'
